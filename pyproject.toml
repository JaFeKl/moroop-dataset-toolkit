[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moroop-dataset-toolkit"
version = "1.0.0"
description = "Download, load, and reproduce figures from the MoRoOp dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MoRoOp contributors" }]
dependencies = [
    "huggingface_hub>=0.28",
    "jupyter>=1.1",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
moroop = "moroop_dataset_toolkit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
